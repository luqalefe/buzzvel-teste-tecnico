# =============================================================================
#  BuzzPay — Nginx server block (SITE NOVO / ADITIVO)
# -----------------------------------------------------------------------------
#  Laravel 12 (API REST + Sanctum) que TAMBÉM serve a SPA React/Vite a partir de
#  public/. App único: a SPA é resolvida pelo próprio Laravel via public/index.php.
#
#  ISOLAMENTO TOTAL dos outros sites desta VPS compartilhada:
#    - Pool PHP-FPM e socket DEDICADOS  -> unix:/run/php/buzzpay.sock
#    - server_name próprio (${DOMAIN})  -> não captura tráfego de outros vhosts
#      (sem `default_server`/catch-all: não rouba requisições alheias)
#    - Logs próprios                    -> /var/log/nginx/buzzpay.{access,error}.log
#  NÃO toca em nenhum vhost/config existente. Habilitar via:
#    ln -s /etc/nginx/sites-available/buzzpay.conf /etc/nginx/sites-enabled/
#    nginx -t && systemctl reload nginx   (reload, NUNCA restart)
#
#  TLS/HSTS: NÃO definir o bloco 443 aqui. O `certbot --nginx -d ${DOMAIN}`
#  injeta automaticamente o listen 443 ssl, os certificados e o redirect 80->443,
#  reaproveitando este mesmo server block (e a location de PHP abaixo).
#  Por isso este arquivo declara apenas `listen 80`.
#
#  HEADERS DE SEGURANÇA / CSP: NÃO duplicar aqui. A aplicação já os emite via
#  middleware App\Http\Middleware\SecurityHeaders (Content-Security-Policy com
#  nonce, X-Frame-Options: DENY, X-Content-Type-Options, Referrer-Policy,
#  Permissions-Policy, X-Permitted-Cross-Domain-Policies). Defini-los também no
#  Nginx geraria headers duplicados/conflitantes. (HSTS fica a cargo do certbot.)
# =============================================================================

server {
    # IPv4-only de propósito. Numa VPS compartilhada, se este vhost escutasse em
    # [::] e fosse o primeiro bloco IPv6 (ordem de carregamento de sites-enabled),
    # ele viraria o default_server de [::]:443 e serviria SEU certificado para
    # qualquer domínio com AAAA que não tenha bloco IPv6 próprio. Adicione
    # `listen [::]:80;` / `listen [::]:443 ssl;` apenas se ${DOMAIN} tiver AAAA.
    listen 80;

    # Valor real preenchido no deploy (ex.: pay.exemplo.com).
    # Sem `default_server`: este vhost SÓ responde ao seu próprio domínio (apex + www).
    server_name ${DOMAIN} www.${DOMAIN};

    # Document root do Laravel — front controller em public/index.php.
    root /var/www/buzzpay/public;
    index index.php;

    charset utf-8;

    # Corpo de requisição: a API é JSON-only (sem upload multipart em nenhum
    # endpoint), então um teto modesto basta e ainda contém abusos.
    client_max_body_size 4M;

    # Logs dedicados (não compartilha com os outros sites da VPS).
    access_log /var/log/nginx/buzzpay.access.log;
    error_log  /var/log/nginx/buzzpay.error.log;

    # -------------------------------------------------------------------------
    #  Compressão (apenas conteúdo textual; assets binários já vêm comprimidos).
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/manifest+json
        application/vnd.ms-fontobject
        font/ttf
        font/otf
        image/svg+xml;

    # ACME http-01 challenge — precisa ficar acessível ANTES de qualquer deny de
    # dotfiles para o certbot emitir/renovar o certificado de ${DOMAIN}.
    # `^~` tem precedência sobre as locations regex (inclusive o deny de /\.).
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    #  Assets versionados do Vite (public/build/*) — hash no nome do arquivo,
    #  portanto cache longo + immutable. Vite emite o manifest em
    #  build/manifest.json e os bundles com hash, então a invalidação é
    #  automática a cada deploy. try_files =404 evita cair no fallback da SPA
    #  (devolve 404 p/ asset ausente em vez do HTML raiz).
    # -------------------------------------------------------------------------
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Front controller padrão do Laravel.
    # A SPA (rotas client-side do React Router) cai em /index.php, que devolve a
    # view raiz da app; o Laravel também trata /api/* e /api/documentation +
    # /docs (l5-swagger) por aqui.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -------------------------------------------------------------------------
    #  Execução PHP via pool/socket DEDICADO do BuzzPay.
    #  Restrito ao FRONT CONTROLLER (index.php): em um document root Laravel
    #  nenhum outro .php deve ser executável — impede execução de qualquer .php
    #  solto/enviado para dentro de public/. Padrão oficial Laravel/nginx.
    # -------------------------------------------------------------------------
    location ~ ^/index\.php(/|$) {
        # Separa o caminho do script (SCRIPT_NAME) do PATH_INFO.
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Não vazar PHP de upload/dir inexistente para o FPM.
        try_files $uri =404;

        fastcgi_pass unix:/run/php/buzzpay.sock;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # TLS para o Laravel: o fastcgi_params padrão do Ubuntu 24.04 NÃO define
        # HTTPS. Sem isto, após o certbot injetar o listen 443 ssl o app geraria
        # URLs http:// e cookies inseguros. `$https` é vazio na :80 (param não
        # enviado, graças ao if_not_empty) e vale "on" automaticamente quando o
        # certbot adicionar o listen 443 ssl a este mesmo server block.
        fastcgi_param HTTPS $https if_not_empty;

        # Margem de buffer/timeout para a chamada de câmbio (exchangerate-api.com,
        # EXCHANGE_PROVIDER_TIMEOUT padrão de 5s no app — folga aqui é conservadora).
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # -------------------------------------------------------------------------
    #  Hardening de acesso a arquivos sensíveis.
    # -------------------------------------------------------------------------
    # Nega dotfiles (.env, .git, .htaccess, etc.) — EXCETO /.well-known,
    # já liberado acima com `^~` (que tem precedência sobre este regex).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Defesa em profundidade explícita para .env / diretório .git
    # (redundante: o `location ~ /\.` acima já casa primeiro na ordem do arquivo;
    # mantido caso aquele bloco seja editado no futuro).
    location ~ ^/(\.env|\.git) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Não loggar ruído comum.
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
