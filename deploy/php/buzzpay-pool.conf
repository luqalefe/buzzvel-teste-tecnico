; =============================================================================
; BuzzPay — POOL PHP 8.3-FPM DEDICADO
; -----------------------------------------------------------------------------
; Destino no servidor:  /etc/php/8.3/fpm/pool.d/buzzpay.conf
; Serviço:              php8.3-fpm
; Aplicação:            /var/www/buzzpay  (Laravel 12, API REST + Sanctum + SPA)
;
; OBJETIVO: ISOLAMENTO TOTAL deste pool em relação aos demais sites da VPS.
; Este arquivo é ADITIVO: NÃO substitui o pool padrão (www.conf) nem nenhum
; pool existente. Apenas ADICIONA o pool [buzzpay], com socket, usuário, logs
; e limites próprios. Os outros sites continuam intactos.
;
; Aplicar (idempotente, sem derrubar os demais sites):
;   sudo php-fpm8.3 -t                 # valida a configuração (test)
;   sudo systemctl reload php8.3-fpm   # reload, NÃO restart
;
; -----------------------------------------------------------------------------
; DEPENDÊNCIAS DE EXTENSÃO (informativo)
; -----------------------------------------------------------------------------
; Extensões PHP são carregadas GLOBALMENTE (mods-available / conf.d), NÃO no
; pool. Aqui só documentamos o que o BuzzPay exige em runtime, com base no
; código real do projeto:
;
;   - pdo_pgsql / pgsql  -> banco PostgreSQL (config/database.php usa driver
;                           'pgsql'; .env de produção fixa DB_CONNECTION=pgsql)
;   - bcmath             -> aritmética de precisão monetária; app/Services/
;                           ExchangeRate.php usa bcadd/bcsub/bcdiv. OBRIGATÓRIA.
;                           ATENÇÃO: composer.json NÃO declara "ext-bcmath" em
;                           require (constraint só "php": "^8.2"), portanto NÃO
;                           há trava no nível do Composer — instalar
;                           php8.3-bcmath no servidor é obrigatório.
;   - curl + openssl     -> cliente HTTP p/ exchangerate-api.com (config/exchange.php)
;   - mbstring, ctype, tokenizer, fileinfo, dom/xml, pcre -> base Laravel 12
;     (json é embutido no core do PHP 8.x; intl é apenas "suggest", coberto por
;      symfony/polyfill — NÃO é obrigatória)
;   - opcache            -> habilitado abaixo (flag PHP_INI_ALL por pool)
;
; cache/session/queue usam o driver 'database' — NÃO há dependência de Redis em
; runtime. NÃO há queue worker: o comando agendado é 'payment-requests:expire'
; (routes/console.php, ->hourly()) disparado pelo timer systemd que roda
; 'php artisan schedule:run' a cada minuto.
;
; Garantir as extensões no servidor (idempotente; não reinstala se já houver):
;   sudo apt-get install -y php8.3-pgsql php8.3-bcmath php8.3-curl \
;        php8.3-mbstring php8.3-xml php8.3-opcache
; =============================================================================

[buzzpay]

; -----------------------------------------------------------------------------
; Identidade do processo / isolamento de usuário
; -----------------------------------------------------------------------------
; Workers rodam como o usuário dono da app (buzzpay) no grupo www-data.
; Isso isola os arquivos do BuzzPay dos pools dos outros sites: nenhum outro
; pool roda como 'buzzpay', e este pool não roda como o usuário de ninguém.
user = buzzpay
group = www-data

; -----------------------------------------------------------------------------
; Socket DEDICADO (Unix) — consumido SOMENTE pelo vhost nginx do BuzzPay
; -----------------------------------------------------------------------------
; Socket exclusivo deste pool. O nginx (www-data) precisa conseguir escrever
; nele, por isso owner/group = www-data e mode 0660 (sem acesso a "outros").
listen = /run/php/buzzpay.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Aceita conexões apenas do localhost via socket Unix (sem TCP exposto).
; (Não definimos listen.allowed_clients pois o socket Unix não usa TCP.)

; -----------------------------------------------------------------------------
; Gerenciamento de processos — pm = dynamic
; -----------------------------------------------------------------------------
; Valores CONSERVADORES para VPS pequena/COMPARTILHADA (vários sites no mesmo
; host). Objetivo: não monopolizar RAM/CPU dos demais pools.
;
; AJUSTÁVEIS: dimensione conforme RAM livre e o consumo real por worker.
; Regra prática: pm.max_children ≈ (RAM dedicável ao BuzzPay) / (RSS médio por
; worker, ~30-60 MB num app Laravel). Suba gradualmente e observe
; /var/log/php8.3-fpm-buzzpay.log à procura do aviso "seems busy".
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Recicla cada worker após N requisições para mitigar vazamentos de memória
; de bibliotecas de terceiros (mantém o footprint estável na VPS compartilhada).
pm.max_requests = 500

; Endpoint de status do pool (restrito; exposto só internamente via nginx, se desejado).
; pm.status_path = /buzzpay-fpm-status
; ping.path = /buzzpay-fpm-ping

; -----------------------------------------------------------------------------
; Timeouts
; -----------------------------------------------------------------------------
; request_terminate_timeout é o ÚNICO kill switch de tempo de PAREDE (wall-clock)
; do worker: max_execution_time (abaixo) só conta CPU e NÃO mata um worker
; travado em I/O de rede (ex.: chamada HTTPS pendurada ao exchangerate-api.com).
; Por isso mantemos request_terminate_timeout acima do EXCHANGE_PROVIDER_TIMEOUT
; (default 5s em config/exchange.php) e alinhado/acima da fastcgi_read_timeout do
; nginx. AJUSTÁVEL conforme a operação mais lenta.
request_terminate_timeout = 60s

; Loga em arquivo o backtrace de requisições que passarem deste limite
; (útil para diagnosticar lentidão sem matar o worker imediatamente).
request_slowlog_timeout = 10s
slowlog = /var/log/php8.3-fpm-buzzpay.slow.log

; -----------------------------------------------------------------------------
; Logs DEDICADOS do pool (isolados dos outros sites)
; -----------------------------------------------------------------------------
; Captura stdout/stderr dos workers (erros PHP, dumps, etc.) no log do pool,
; em vez de descartá-los — facilita o debug sem misturar com outros pools.
catch_workers_output = yes
decorate_workers_output = no

; Limita o tamanho de cada linha de log capturada (evita logs gigantes).
; log_limit = 8192

; -----------------------------------------------------------------------------
; Hardening de execução (defense-in-depth)
; -----------------------------------------------------------------------------
; O document root (/var/www/buzzpay/public) serve a SPA React/Vite com ativos
; estáticos arbitrários; o único .php real é o front controller index.php.
; Pinamos a extensão executável para que ESTE pool jamais execute outro tipo de
; arquivo caso o vhost nginx algum dia roteie errado. Totalmente aditivo.
security.limit_extensions = .php

; -----------------------------------------------------------------------------
; Diretivas PHP por pool (php_admin_value / php_admin_flag NÃO são
; sobrescrevíveis por ini_set() na aplicação — hardening real)
; -----------------------------------------------------------------------------
; IMPORTANTE — ESCOPO INI:
;   Apenas diretivas PHP_INI_ALL ou PHP_INI_PERDIR podem ser efetivamente
;   definidas por pool. Diretivas PHP_INI_SYSTEM (lidas só na inicialização do
;   processo MASTER do php8.3-fpm) são IGNORADAS aqui — e, numa VPS
;   compartilhada, NÃO devem ser forçadas globalmente pelo BuzzPay, pois
;   afetariam todos os outros pools/sites (violaria o isolamento). Ver bloco
;   de OPcache mais abaixo.

; Log de erros próprio do BuzzPay (separado dos demais sites).
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.3-fpm-buzzpay.log

; Em produção não exibimos erros ao cliente (a app já roda com APP_DEBUG=false).
php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off

; expose_php é uma diretiva GLOBAL (PHP_INI_SYSTEM): NÃO pode ser definida por
; pool. Desligar o header "X-Powered-By: PHP/..." deve ser feito no php.ini do
; FPM (/etc/php/8.3/fpm/php.ini -> expose_php = Off).
; (Adicionalmente, o vhost nginx do BuzzPay já oculta o header Server/X-Powered-By.)

; -----------------------------------------------------------------------------
; OPcache — diretivas PHP_INI_ALL (legítimas por pool)
; -----------------------------------------------------------------------------
; opcache.enable, opcache.validate_timestamps e opcache.revalidate_freq são
; PHP_INI_ALL: válidas por pool/por requisição. Aqui ativamos o OPcache para
; este pool e desligamos a revalidação por timestamp p/ desempenho de produção.
php_admin_flag[opcache.enable] = on
; validate_timestamps=0 => máximo desempenho; EXIGE limpar o cache em cada
; deploy (systemctl reload php8.3-fpm OU opcache_reset()). AJUSTÁVEL: use 1 +
; revalidate_freq se preferir recarga automática sem reload.
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.revalidate_freq] = 0

; -----------------------------------------------------------------------------
; OPcache — SIZING (PHP_INI_SYSTEM): NÃO definir por pool!
; -----------------------------------------------------------------------------
; opcache.memory_consumption, opcache.interned_strings_buffer e
; opcache.max_accelerated_files são PHP_INI_SYSTEM. O OPcache é UM segmento de
; memória compartilhada do processo MASTER do php8.3-fpm, lido uma única vez na
; inicialização do módulo. Defini-los aqui seria IGNORADO; e se valesse,
; alteraria o orçamento de memória do OPcache de TODOS os sites da VPS
; (destrutivo / quebra de isolamento). Portanto NÃO ficam neste pool.
;
; Se o operador quiser ajustar o sizing do OPcache (ciente de que é GLOBAL ao
; master php8.3-fpm), faça via drop-in dedicado e claramente identificado, p.ex.
; /etc/php/8.3/fpm/conf.d/zz-buzzpay-opcache.ini, contendo:
;   opcache.enable=1
;   opcache.memory_consumption=128
;   opcache.interned_strings_buffer=16
;   opcache.max_accelerated_files=20000
; seguido de: sudo php-fpm8.3 -t && sudo systemctl reload php8.3-fpm

; -----------------------------------------------------------------------------
; Limites de runtime (PHP_INI_ALL/PERDIR) alinhados a um app de pagamentos
; (sem uploads pesados).
; -----------------------------------------------------------------------------
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 55
php_admin_value[upload_max_filesize] = 8M
php_admin_value[post_max_size] = 10M

; Fuso horário consistente para logs (config/app.php usa 'timezone' => 'UTC').
php_admin_value[date.timezone] = UTC

; -----------------------------------------------------------------------------
; Variáveis de ambiente do pool
; -----------------------------------------------------------------------------
; Por padrão o PHP-FPM "limpa" o environment dos workers (clear_env = yes), de
; modo que variáveis de outros sites/serviços NÃO vazam para o BuzzPay e
; vice-versa. A app lê segredos do seu próprio .env (chmod 600), não daqui.
; Mantemos explícito para reforçar o isolamento.
clear_env = yes

; PATH mínimo e previsível para os workers.
env[PATH] = /usr/local/bin:/usr/bin:/bin
